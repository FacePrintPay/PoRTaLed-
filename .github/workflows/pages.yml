name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        shell: bash
        run: |
          mkdir -p site
          if [ -d docs ]; then
            cp -r docs/* site/ 2>/dev/null || true
          fi
          if [ ! -f site/index.html ]; then
            cat > site/index.html <<'EOF2'
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Repository</title></head>
  <body><h1>Repository</h1><p>GitHub Pages enabled.</p></body>
</html>
EOF2
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
